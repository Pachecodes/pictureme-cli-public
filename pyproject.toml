[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pictureme-cli"
version = "0.1.0"
description = "Command-line client for the PictureME v3 generation API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jesus Pacheco / Akitá Labs" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "platformdirs>=4.2",
    "rich>=13.7",
]

[project.scripts]
pictureme = "pictureme.cli:app"
picme = "pictureme.cli:app"

[tool.setuptools.packages.find]
include = ["pictureme*"]

[project.urls]
Repository = "https://github.com/Pachecodes/pictureme-cli-public"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
